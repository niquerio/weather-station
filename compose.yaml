services:
  app:
    build:
      context: .
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - .:/app
    env_file:
      - .env
  web:
    build:
      context: .
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - 8000:8000
      #- 9100:9100
    volumes:
      - .:/app
    env_file:
      - .env
    command:
      - "poetry" 
      - "run" 
      - "uvicorn" 
      - "main:app" 
      - "--host" 
      - "0.0.0.0"
      - "--reload"
  js:
    build:
      context: .
      target: assets
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - .:/app
    env_file:
      - .env
    command:
      - npm
      - run
      - watch
